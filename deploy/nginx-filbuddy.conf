# ============================================================
# Nginx reverse proxy FilBuddy — HTTPS via Cloudflare Origin Certificate
#
# Setup (lihat panduan langkah demi langkah di chat):
#   1. Ganti "filbuddy.example.com" dengan domain kamu (2 tempat).
#   2. Buat Origin Certificate di dashboard Cloudflare
#      (SSL/TLS → Origin Server → Create Certificate),
#      simpan sebagai:
#        /etc/ssl/cloudflare/filbuddy.pem   (Origin Certificate)
#        /etc/ssl/cloudflare/filbuddy.key   (Private Key, chmod 600)
#   3. sudo cp deploy/nginx-filbuddy.conf /etc/nginx/sites-available/filbuddy
#      sudo ln -sf /etc/nginx/sites-available/filbuddy /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#   4. Cloudflare dashboard: SSL/TLS → Overview → mode **Full (strict)**
#
# Catatan: sertifikat origin HANYA dipercaya Cloudflare — akses
# https langsung ke IP VPS akan muncul warning browser. Itu normal.
# ============================================================

server {
    listen 80;
    server_name filbuddy.example.com;

    # Semua HTTP diarahkan ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name filbuddy.example.com;

    ssl_certificate     /etc/ssl/cloudflare/filbuddy.pem;
    ssl_certificate_key /etc/ssl/cloudflare/filbuddy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5M;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Aset statis Next.js (hashed) — boleh di-cache agresif
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
