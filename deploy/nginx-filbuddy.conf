# ============================================================
# Nginx reverse proxy untuk FilBuddy (Next.js di port 3000)
#
# Cara pakai di VPS:
#   1. Ganti "filbuddy.example.com" dengan domain kamu (2 tempat).
#   2. sudo cp deploy/nginx-filbuddy.conf /etc/nginx/sites-available/filbuddy
#   3. sudo ln -s /etc/nginx/sites-available/filbuddy /etc/nginx/sites-enabled/
#   4. sudo rm -f /etc/nginx/sites-enabled/default
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. Setelah DNS domain mengarah ke IP VPS, aktifkan HTTPS:
#        sudo apt install -y certbot python3-certbot-nginx
#        sudo certbot --nginx -d filbuddy.example.com
# ============================================================

server {
    listen 80;
    server_name filbuddy.example.com;

    client_max_body_size 5M;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Aset statis Next.js (hashed) — boleh di-cache agresif
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
